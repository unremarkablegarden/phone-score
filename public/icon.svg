<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A score: timed segments of differing lengths — one done, one running, one to come. -->
  <rect width="512" height="512" rx="112" fill="#0b0a09" />

  <g fill="#f5f5f4">
    <!-- finished -->
    <rect x="88" y="128" width="272" height="56" rx="28" />

    <!-- running: a dim track with a bright fill -->
    <rect x="88" y="228" width="336" height="56" rx="28" opacity="0.22" />
    <rect x="88" y="228" width="176" height="56" rx="28" />

    <!-- upcoming -->
    <rect x="88" y="328" width="212" height="56" rx="28" opacity="0.22" />
  </g>
</svg>
